    description: "Authentication layer (End-to-End)"
    tasks:
      frontend:
        - "Auth.js v5 session provider, middleware, login page layout"
      backend:
        - "Google OAuth + JWT generation and issuance"
    dependencies:
      - bootstrap

  - id: nlp-pipeline
    phase: 2
    frontend: false
    backend: true
    description: "Core backend text-processing pipeline"
    tasks:
      backend:
        - "Sentence segmentation engine"
        - "JLPT dictionary RAG lookup routine"
        - "Grammar pattern matching engine"
        - "LLM batch call orchestration & output structuring"
    dependencies:
      - bootstrap

  - id: input-ui
    phase: 2
    frontend: true
    backend: false
    description: "Frontend content ingestion interface (Contract Mocked)"
    tasks:
      frontend:
      - "Build /content/new route"
      - "Implement InputForm & FileUpload components"
      - "Create useContentSubmit hook targeting lib/api.ts contract"
    dependencies:
      - bootstrap

  - id: dashboard-ui
    phase: 2
    frontend: true
    backend: false
    description: "Frontend main dashboard interface (Contract Mocked)"
    tasks:
      frontend:
      - "Build /dashboard route"
      - "Create ContentCard UI with loading, processing, and error states"
      - "Implement useJobStream SSE hook pattern via mocked contract"
    dependencies:
      - bootstrap
      - auth

